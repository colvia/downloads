name: Refresh Colvia Preview timestamps

'on':
  schedule:
    - cron: '23 2 * * 2'
  workflow_dispatch:

permissions: {}
concurrency:
  group: colvia-preview-publication
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'colvia/downloads' && github.ref == 'refs/heads/main' && vars.COLVIA_APPROVED_MANIFEST_SHA256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: preview-timestamp
      url: https://colvia.github.io/downloads/
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      COLVIA_APPROVED_MANIFEST_SHA256: ${{ vars.COLVIA_APPROVED_MANIFEST_SHA256 }}
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned verification libraries
        run: |
          python3 -m venv .publish-venv
          .publish-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps -r scripts/requirements-publish.txt
      - name: Check approval and prepare all three timestamps
        env:
          COLVIA_TIMESTAMP_KEY_B64: ${{ secrets.COLVIA_TIMESTAMP_KEY_B64 }}
        run: .publish-venv/bin/python -B scripts/refresh_timestamp.py prepare --work .timestamp-work
      - name: Upload the verified Pages snapshot
        id: upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .timestamp-work/site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the uploaded Pages artifact to be listed
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::The Pages upload did not return an artifact ID.'
            exit 1
          fi
          # Upload completion can precede visibility to the artifact lookup service.
          for attempt in {1..12}; do
            sleep 5
            metadata=$(timeout 8s gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --raw-field "name=$PAGES_ARTIFACT_NAME")
            state=$(jq -er --arg id "$PAGES_ARTIFACT_ID" --arg name "$PAGES_ARTIFACT_NAME" '
              if .total_count == 0 and .artifacts == [] then "pending"
              elif .total_count == 1 and (.artifacts | type) == "array" and
                (.artifacts | length) == 1 and
                (.artifacts[0] | (.id | tostring) == $id and .name == $name and
                  .expired == false and (.size_in_bytes | type) == "number" and .size_in_bytes > 0)
              then "ready"
              else error("Unexpected Pages artifact metadata")
              end
            ' <<< "$metadata")
            if [[ "$state" == ready ]]; then
              printf 'Pages artifact %s is visible.\n' "$PAGES_ARTIFACT_ID"
              exit 0
            fi
            printf 'Pages artifact %s is not listed yet (%s/12).\n' "$PAGES_ARTIFACT_ID" "$attempt"
          done
          echo '::error::The uploaded Pages artifact did not become visible.'
          exit 1
      - name: Deploy Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify public timestamps and check upstream expiry
        run: .publish-venv/bin/python -B scripts/refresh_timestamp.py verify --work .timestamp-work

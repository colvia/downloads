name: Publish approved Colvia Preview

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Approved release tag (vX.Y.Z-preview.N)
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the approved publish-manifest.json
        required: true
        type: string
      review_installation:
        description: Wait for official-installation verification before Release publication
        required: false
        type: boolean
        default: false
      pages_only:
        description: Verify an approved baseline on Pages before the final release
        required: false
        type: boolean
        default: false

permissions: {}
concurrency:
  group: colvia-preview-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

jobs:
  pages:
    if: github.repository == 'colvia/downloads' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      # GitHub lists Release drafts only for tokens with repository write access.
      contents: write
      actions: read
      pages: write
      id-token: write
    outputs:
      marker_sha256: ${{ steps.prepare.outputs.marker_sha256 }}
      release_environment: ${{ steps.prepare.outputs.environment }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the verification libraries
        run: |
          python3 -m venv .publish-venv
          .publish-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps -r scripts/requirements-publish.txt
      - name: Verify approved files and compare with live Pages
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_INSTALLATION: ${{ inputs.review_installation }}
        run: .publish-venv/bin/python -B scripts/publish.py prepare --work .publish-work
      - name: Upload the complete Pages snapshot
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .publish-work/site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deploy
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record Pages result
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: >-
          printf 'Pages job %s (attempt %s). Deployment URL if deployed: %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PAGE_URL"

  verify:
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify anonymous HTTPS responses
        env:
          PAGES_MARKER_SHA256: ${{ needs.pages.outputs.marker_sha256 }}
        run: python3 -B scripts/publish.py verify --work .publish-work

  release:
    needs: [pages, verify]
    if: ${{ !inputs.pages_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    environment: ${{ needs.pages.outputs.release_environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the verification libraries
        run: |
          python3 -m venv .publish-venv
          .publish-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps -r scripts/requirements-publish.txt
      - name: Resume the release and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: .publish-venv/bin/python -B scripts/publish.py release --work .publish-work
